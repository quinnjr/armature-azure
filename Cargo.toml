[package]
name = "armature-azure"
version = "0.2.1"
edition = "2024"
rust-version = "1.94.1"
authors = ["Joseph Quinn <quinn.josephr@proton.me>"]
license = "Apache-2.0"
repository = "https://github.com/quinnjr/armature-azure"
homepage = "https://quinnjr.github.io/armature"
description = "Microsoft Azure services integration for Armature - dynamically loadable and DI-ready"
keywords = ["azure", "cloud", "blob", "cosmos", "servicebus"]
categories = ["web-programming", "asynchronous"]

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["sync"] }
async-trait = "0.1"
futures = "0.3"

# Azure SDK core
azure_core = { version = "1.1", optional = true }
azure_identity = { version = "1.0", optional = true }

# Azure services (all optional)
azure_storage_blob = { version = "1.1", optional = true }
azure_storage_queue = { version = "1.1", optional = true }
azure_data_cosmos = { version = "0.38", optional = true }
# Service Bus talks to the REST API directly (src/servicebus.rs) with Shared
# Access Signatures. The azure_messaging_servicebus SDK is not used: its newest
# release (0.21) needs azure_core 0.21, which logs live authorization headers at
# debug/trace level (RUSTSEC-2026-0275). rustls only (no native-tls/OpenSSL).
reqwest = { version = "0.13", optional = true, default-features = false, features = ["rustls"] }
hmac = { version = "0.13.0", optional = true }
sha2 = { version = "0.11", optional = true }
base64 = { version = "0.23", optional = true }
httpdate = { version = "1.0", optional = true }
azure_security_keyvault_secrets = { version = "1.0", optional = true }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"

# Utilities
tracing = "0.1"
parking_lot = "0.12"
url = "2.5"

[dev-dependencies]
cargo-husky = { version = "1.5", default-features = false, features = ["user-hooks"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "fs", "test-util"] }
wiremock = "0.6"

[features]
default = []
# Core auth
auth = ["azure_identity", "azure_core"]
# Individual services
blob = ["azure_storage_blob", "auth"]
queue = ["azure_storage_queue", "auth"]
cosmos = ["azure_data_cosmos", "auth"]
servicebus = ["auth", "reqwest", "hmac", "sha2", "base64", "httpdate"]
keyvault = ["azure_security_keyvault_secrets", "auth"]
# Service groups
storage = ["blob", "queue"]
messaging = ["servicebus"]
data = ["cosmos"]
security = ["keyvault"]
# All services
all = ["storage", "messaging", "data", "security"]

